name: Integrity Test CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrity-tech-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrity-tech-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/integrity_ci?schema=public

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/integrity_ci?schema=public

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrity-tech-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrity-tech-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sync engine tests
        run: npm run test:sync-engine

      - name: API client and deployment config tests
        run: npm run test:api-client && npm run test:deployment-config

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
          NEXT_PUBLIC_ENABLE_DEMO_MOCKS: "false"
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_BUILD_DATE: ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for pilot tooling
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated pilot configuration
        run: node scripts/setup-pilot.mjs

      - name: Build pilot images
        run: docker compose --env-file .env.pilot -f docker-compose.pilot.yml build

      - name: Full isolated recovery drill
        run: node scripts/rehearse-recovery.mjs

      - name: Upload recovery verification without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-recovery-verification
          path: output/recovery-readiness/verification.json
          if-no-files-found: ignore

  e2e:
    name: Enterprise E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integrity_tech_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integrity_tech_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:localpassword123@127.0.0.1:5432/integrity_tech_e2e?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_KEY_PREFIX: "integrity:e2e:"
      RATE_LIMIT_STORE: redis
      RATE_LIMIT_REDIS_REQUIRED: "true"
      JWT_SECRET: e2e-jwt-secret-with-at-least-thirty-two-characters
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 1
      CORS_ORIGINS: http://127.0.0.1:3000
      SHOW_SWAGGER: "false"
      ENABLE_DEV_AUTH: "false"
      API_BODY_LIMIT: 1mb
      STORAGE_PROVIDER: local-private
      STORAGE_LOCAL_PRIVATE_PATH: .private-storage/e2e
      STORAGE_SIGNED_URL_TTL_SECONDS: 120
      STORAGE_MAX_FILE_BYTES: 2097152
      E2E_BACKEND_URL: http://127.0.0.1:3001
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      E2E_API_BASE_URL: http://127.0.0.1:3001/api
      E2E_STAFF_PASSWORD: IntegrityE2E123!
      BACKEND_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_ENABLE_DEMO_MOCKS: "false"
      NEXT_PUBLIC_APP_ENV: e2e
      NEXT_PUBLIC_BUILD_DATE: e2e
      OTEL_ENABLED: "false"
      LOG_LEVEL: warn
      LATE_ANSWER_WINDOW_MS: 300000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: integrity-tech-backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: integrity-tech-frontend
        run: npm ci

      - name: Apply database migrations
        working-directory: integrity-tech-backend
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: integrity-tech-backend
        run: npx prisma generate

      - name: Seed E2E data
        working-directory: integrity-tech-backend
        run: npm run seed:e2e

      - name: Build backend for smoke validation
        working-directory: integrity-tech-backend
        run: npm run build

      - name: Start backend for smoke validation
        run: |
          mkdir -p .ci-logs
          setsid bash -lc '
            cd integrity-tech-backend
            echo "Starting backend from: $(pwd)"
            exec npm run start:prod
          ' > .ci-logs/backend-smoke.log 2>&1 &
          echo "$!" > .ci-logs/backend-smoke.pid
        env:
          PORT: "3001"

      - name: Wait for backend readiness
        run: |
          print_backend_diagnostics() {
            echo "---- pwd ----"
            pwd
            echo "---- ls ----"
            ls -la
            echo "---- ls integrity-tech-backend ----"
            ls -la integrity-tech-backend || true
            echo "---- find integrity-tech-backend/dist -maxdepth 3 -type f ----"
            find integrity-tech-backend/dist -maxdepth 3 -type f || true
            echo "---- cat integrity-tech-backend/package.json ----"
            cat integrity-tech-backend/package.json || true
            echo "---- start:prod script ----"
            node -e "const p=require('./integrity-tech-backend/package.json'); console.log(p.scripts && p.scripts['start:prod']);" || true
            echo "---- backend logs ----"
            cat .ci-logs/backend-smoke.log || true
            echo "---- health response ----"
            cat /tmp/integrity-health-ready.txt || true
          }

          for attempt in {1..60}; do
            status="$(curl -sS -o /tmp/integrity-health-ready.txt -w "%{http_code}" http://127.0.0.1:3001/health/ready || true)"
            if [ "$status" = "200" ]; then
              echo "Backend is ready."
              exit 0
            fi

            if [ -f .ci-logs/backend-smoke.pid ] && ! kill -0 "-$(cat .ci-logs/backend-smoke.pid)" 2>/dev/null; then
              echo "Backend process exited before readiness."
              print_backend_diagnostics
              exit 1
            fi

            sleep 2
          done

          echo "Backend did not become ready before timeout."
          print_backend_diagnostics
          exit 1

      - name: Database smoke validation
        working-directory: integrity-tech-backend
        run: npm run smoke

      - name: Show backend logs on smoke failure
        if: failure()
        run: |
          echo "---- backend smoke logs ----"
          cat .ci-logs/backend-smoke.log || true

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Backup and restore smoke validation
        working-directory: integrity-tech-backend
        run: npm run smoke:backup-restore

      - name: Stop backend after smoke validations
        if: always()
        run: |
          print_port_diagnostics() {
            echo "---- processes listening on 3001 ----"
            if command -v lsof >/dev/null 2>&1; then
              lsof -nP -iTCP:3001 -sTCP:LISTEN || true
            fi
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp 'sport = :3001' || true
            fi
            echo "---- node/npm processes ----"
            ps -ef | grep -E 'node|npm|nest' | grep -v grep || true
            echo "---- backend smoke logs ----"
            cat .ci-logs/backend-smoke.log || true
          }

          if [ -f .ci-logs/backend-smoke.pid ]; then
            pgid="$(cat .ci-logs/backend-smoke.pid)"
            if kill -0 "-$pgid" 2>/dev/null; then
              echo "Stopping backend process group $pgid"
              kill -TERM "-$pgid" 2>/dev/null || true

              for attempt in {1..20}; do
                if ! kill -0 "-$pgid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "-$pgid" 2>/dev/null; then
                echo "Backend process group $pgid did not stop after SIGTERM; sending SIGKILL."
                kill -KILL "-$pgid" 2>/dev/null || true
              fi

              wait "$pgid" 2>/dev/null || true
            fi
          fi

          for attempt in {1..30}; do
            status="$(curl -sS -o /tmp/integrity-health-live-after-stop.txt -w "%{http_code}" http://127.0.0.1:3001/health/live || true)"
            if [ "$status" = "000" ]; then
              echo "Backend port 3001 is free."
              exit 0
            fi
            sleep 1
          done

          echo "Backend port 3001 is still responding after shutdown."
          print_port_diagnostics
          exit 1

      - name: Install Playwright browser
        working-directory: integrity-tech-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Enterprise E2E
        working-directory: integrity-tech-frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: integrity-tech-frontend/playwright-report
          if-no-files-found: ignore
